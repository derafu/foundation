# Base routes of a Derafu web application.
#
# Import it from the routes.yaml of the site:
#
#   imports:
#     - { resource: '../vendor/derafu/foundation/resources/config/foundation-routes.yaml' }
#
# It imports the routes of the content and contact form packages and defines the
# home page and the error page, which every site has in the same place
# (templates/pages/home.html.twig and templates/error.html.twig). A site that
# needs something different declares a route with the same name in its own
# routes.yaml: its definition replaces the one of this file.

imports:
  - { resource: '../../../content/resources/config/content-routes.yaml' }
  - { resource: '../../../contact-form/resources/config/contact-form-routes.yaml' }

homepage:
  path: /
  handler: '%kernel.project_dir%/templates/pages/home.html.twig'

errorpage:
  path: error
  handler: '%kernel.project_dir%/templates/error.html.twig'
