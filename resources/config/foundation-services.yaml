# Base wiring of a Derafu web application.
#
# Import it from the services.yaml of the site:
#
#   imports:
#       - { resource: '../vendor/derafu/foundation/resources/config/foundation-services.yaml' }
#
# Imports the shared services and contributes only site integration:
# session/flash/CSRF middleware, site templates, routing/Twig helpers, locale
# and application infrastructure. Packages contribute their own templates,
# components and extensions through tags; no private renderer is constructed.
# Applications may add contributions or override configuration after this import.
#
# The captcha of the forms is configured with the environment variables
# CAPTCHA_PROVIDER, CAPTCHA_SITE_KEY and CAPTCHA_SECRET_KEY (see
# derafu/captcha): the forms that are protected with a captcha, like the contact
# form, fail until the site sets CAPTCHA_PROVIDER (CAPTCHA_PROVIDER=none says, on
# purpose, that it has none).
#
# Who the client of a request is (the limits of the requests and of the failed
# logins count by it) is decided by ClientIpMiddleware. By default it is the
# address of the connection, and no header is believed. Behind a proxy, say which
# ones are trusted with HTTP_TRUSTED_PROXIES (addresses, ranges, or the shortcuts
# `loopback`, `private` and `link-local`, separated by commas), and in which
# headers the address comes with HTTP_CLIENT_IP_HEADERS (see derafu/http).
#
# The language of the site is the parameter app.locale: the one of the
# environment variable APP_LOCALE, or English. The site can also set
# app.locale.default.

imports:
    - { resource: '../../../content/resources/config/content-services.yaml' }
    - { resource: '../../../captcha/resources/config/captcha-services.yaml' }
    - { resource: '../../../contact-form/resources/config/contact-form-services.yaml' }
    - { resource: '../../../csrf/resources/config/csrf-services.yaml' }
    - { resource: '../../../data-processor/resources/config/data-processor-services.yaml' }
    - { resource: '../../../form/resources/config/form-services.yaml' }
    - { resource: '../../../http/resources/config/http-static-files-services.yaml' }
    - { resource: '../../../kernel/resources/config/kernel-services.yaml' }
    - { resource: '../../../renderer/resources/config/renderer-markdown-services.yaml' }
    - { resource: '../../../renderer/resources/config/renderer-pdf-services.yaml' }
    - { resource: '../../../routing/resources/config/routing-filesystem-services.yaml' }
    - { resource: '../../../session/resources/config/session-services.yaml' }
    - { resource: '../../../support/resources/config/support-services.yaml' }
    - { resource: '../../../translation/resources/config/translation-services.yaml' }
    - { resource: '../../../twig-components/resources/config/twig-components-twig-services.yaml' }

parameters:
    # The page of the errors in HTML (see ProblemHandler of derafu/http): the
    # template of every site. A site that has others sets the parameter in its
    # own services.yaml (the whole map, it is not merged), with a page for a
    # status (404, 500...) and `default` for the rest.
    derafu.http.error_pages:
        default: '%kernel.project_dir%/templates/error.html.twig'

    derafu.http.static_files.directory: '%kernel.project_dir%/public/static'
    derafu.routing.routes: '%routes%'
    derafu.routing.filesystem.directories:
        - '%kernel.project_dir%/templates/pages'

    app.locale.default: 'en'
    app.locale: '%env(default:app.locale.default:APP_LOCALE)%'

    # Configure Translation's shared service while preserving the site's locale.
    derafu.translation.default_locale: '%app.locale%'
    derafu.translation.fallback_locales: ['en']

    # The lowest score that reCAPTCHA v3 accepts (CAPTCHA_PROVIDER=recaptcha-v3):
    # from 0.0 (a bot) to 1.0 (a person). Stricter than the 0.5 that Google
    # suggests as a start; a site sets CAPTCHA_MIN_SCORE to change it.
    env(CAPTCHA_MIN_SCORE): '0.7'

    # Default of the environment variable that a site uses in its
    # derafu.content.config (cache.enabled: '%env(bool:CONTENT_CACHE_ENABLED)%').
    env(CONTENT_CACHE_ENABLED): 'true'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Existing middleware IDs, with their original collaborators. Session owns
    # persistence configuration; Foundation only chooses the pipeline positions.
    Mezzio\Session\SessionMiddleware:
        arguments:
            $persistence: '@Mezzio\Session\SessionPersistenceInterface'
        tags:
            - { name: derafu_http.middleware, priority: 500 }

    Mezzio\Flash\FlashMessageMiddleware:
        tags:
            - { name: derafu_http.middleware, priority: 450 }

    Derafu\Csrf\CsrfSessionMiddleware:
        arguments:
            $manager: '@Derafu\Csrf\Contract\SessionCsrfTokenManagerInterface'
        tags:
            - { name: derafu_http.middleware, priority: 400 }

    Derafu\Foundation\Provider\SiteTemplatePathProvider:
        arguments:
            $directory: '%kernel.project_dir%/templates'
        tags:
            - { name: derafu_twig.template_path_provider, priority: 300 }

    Derafu\Foundation\Bridge\Twig\FoundationExtensionProvider:
        arguments:
            $router: '@Derafu\Routing\Contract\RouterInterface'
        tags: ['derafu_twig.extension_provider']

    # HTTP client (PSR-18) and PSR-17 factories, used by the packages that make
    # requests (for example derafu/contact-form).
    Psr\Http\Client\ClientInterface:
        class: GuzzleHttp\Client
        arguments:
            $config:
                timeout: 10

    # Both PSR-17 contracts use one shared implementation.
    Psr\Http\Message\RequestFactoryInterface:
        class: GuzzleHttp\Psr7\HttpFactory

    Psr\Http\Message\StreamFactoryInterface:
        alias: Psr\Http\Message\RequestFactoryInterface

    # Cache pool (PSR-6) of the application, in the cache directory of the kernel.
    # The packages that cache what they read (the keys of Keycloak in derafu/auth,
    # the counts of the failed logins) use it. A site that needs another pool
    # declares the same id.
    Psr\Cache\CacheItemPoolInterface:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            $namespace: 'derafu'
            $directory: '%kernel.cache_dir%'
